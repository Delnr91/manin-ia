# =============================================================================
# manin-ia Engine — Docker Compose
# =============================================================================
# Target: Oracle Cloud Free Tier — ARM Ampere A1 (CPU-only, NO GPU)
#
# Architecture:
#   Caddy (reverse proxy + auto TLS) → n8n (workflow engine)
#                                     → Ollama (LLM inference, CPU-only)
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in real values
#   2. DNS A records pointing to this server:
#      - n8n.${DOMAIN}  → server IP
#      - ollama.${DOMAIN} → server IP
#   3. Ports 80 and 443 open in Oracle Cloud security list
#
# Usage:
#   docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Caddy — Reverse Proxy & Automatic HTTPS
  # ---------------------------------------------------------------------------
  # Caddy handles TLS certificate provisioning (Let's Encrypt / ZeroSSL),
  # HTTP→HTTPS redirects, and HTTP/3 (QUIC) termination.
  # All backend services are accessed exclusively through Caddy.
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      # HTTP  — required for ACME challenges + redirect to HTTPS
      - "80:80"
      # HTTPS — primary encrypted traffic
      - "443:443"
      # HTTPS/UDP — HTTP/3 (QUIC) support for lower-latency connections
      - "443:443/udp"
    volumes:
      # Caddyfile configuration — mounted read-only for safety
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent storage for TLS certificates (survives container rebuilds)
      - caddy_data:/data
      # Caddy runtime config (auto-generated)
      - caddy_config:/config
    environment:
      # Domain for Caddy site blocks (used in Caddyfile via {$DOMAIN})
      - DOMAIN=${DOMAIN}
      # Email for ACME TLS certificate registration
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      # API key used to gate access to the Ollama endpoint
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    networks:
      - caddy_net

  # ---------------------------------------------------------------------------
  # n8n — Workflow Automation Engine
  # ---------------------------------------------------------------------------
  # n8n powers the AI agent's workflow logic (tool calling, API orchestration,
  # memory retrieval, etc.). It is NOT exposed directly — Caddy proxies to it.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    # expose makes the port reachable within the Docker network only;
    # it is NOT published to the host. Caddy handles external access.
    expose:
      - "5678"
    volumes:
      # Persistent storage for workflows, credentials, and execution history
      - n8n_data:/home/node/.n8n
    environment:
      # Public webhook URL — must match the domain Caddy serves
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      # Tell n8n it sits behind 1 reverse proxy (Caddy) so it trusts
      # X-Forwarded-* headers for correct client IP detection
      - N8N_PROXY_HOPS=1
      # Encryption key for credentials stored in the n8n database.
      # Generate with: openssl rand -hex 32
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Enforce Secure flag on session cookies (requires HTTPS — which Caddy provides)
      - N8N_SECURE_COOKIE=true
      # Bind to all interfaces inside the container so Caddy can reach it
      - N8N_HOST=0.0.0.0
      # PostgreSQL connection for persistent workflow storage
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy_net

  # ---------------------------------------------------------------------------
  # PostgreSQL — Persistent Database
  # ---------------------------------------------------------------------------
  # Stores n8n workflows, credentials, and execution history.
  # Also available for future app data (engramas, user profiles, etc.).
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caddy_net

  # ---------------------------------------------------------------------------
  # Ollama — Local LLM Inference (CPU-only)
  # ---------------------------------------------------------------------------
  # Runs large language models locally on ARM CPU.
  # ⚠️  NO GPU configuration — Oracle Free Tier Ampere A1 has no GPU.
  #     Inference will be slower than GPU but functional for small models.
  #
  # After first deploy, pull your model:
  #   docker exec ollama ollama pull llama3
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    # Internal-only port — Caddy reverse-proxies with API key auth
    expose:
      - "11434"
    volumes:
      # Persistent storage for downloaded models (can be several GB)
      - ollama_data:/root/.ollama
    environment:
      # Bind to all interfaces so other containers on caddy_net can reach it
      - OLLAMA_HOST=0.0.0.0
    # -----------------------------------------------------------------------
    # NO deploy.resources.reservations.devices section here.
    # This is intentional — Oracle Free Tier Ampere A1 is CPU-only.
    # Adding GPU config would prevent the container from starting.
    # -----------------------------------------------------------------------
    networks:
      - caddy_net

# =============================================================================
# Named Volumes — persist data across container rebuilds / restarts
# =============================================================================
volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  n8n_data:
    name: n8n_data
  ollama_data:
    name: ollama_data
  postgres_data:
    name: postgres_data

# =============================================================================
# Networks
# =============================================================================
networks:
  caddy_net:
    driver: bridge
